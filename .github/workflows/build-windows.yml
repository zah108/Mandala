name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "*.*"   # ваши теги вида 2.2

jobs:
  build:
    name: Сборка инсталлятора (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r windows/requirements-win.txt

      - name: Приложение (PyInstaller)
        run: python -m PyInstaller windows/mandala.spec --noconfirm

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Инсталлятор и portable-zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден: $iscc" }

          & $iscc "windows\installer\mandala.iss" *>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "### ISCC failed, exit code $LASTEXITCODE"
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            ($out | Select-Object -Last 30) | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY $_ }
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            exit $LASTEXITCODE
          }

          & "windows\make_portable.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Mandala-Windows
          path: |
            dist/MandalaSetup-*.exe
            dist/Mandala-portable-*.zip
          if-no-files-found: error
